name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types and Svelte components
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build for the Pages URL
        run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
